[build-system]
# setuptools-rust, not maturin: one wheel must carry the abi3 extension (native/klong-py, in its own cargo workspace) AND the `kg`
# binary (native/klong-cli, in the native workspace). maturin builds one cargo package per wheel and cannot do both.
requires = ["setuptools>=77", "setuptools-rust>=1.10"]
build-backend = "setuptools.build_meta"

[project]
name = "klongpy"
version = "2.0.0rc1"
description = "High-Performance Klong array language with rich Python integration."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Brian Guarraci" }
]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Interpreters",
]
keywords = ["klong", "array", "language", "interpreter", "numpy", "torch"]

dependencies = [
    "numpy>=2.0",
    # the `kgpy` CLI imports colorama unconditionally, so it is a core dep
    # (not just the optional `repl` extra) — otherwise `kgpy file.kg` dies.
    "colorama>=0.4",
]

[project.optional-dependencies]
torch = ["torch"]
# colorama is already a core dependency; this extra is kept so
# `pip install klongpy[repl]` keeps working.
repl = ["colorama>=0.4"]
web = ["aiohttp>=3.9"]
# pip picks the newest pandas that fits the interpreter.
db = ["pandas>=2.0", "duckdb>=1.0"]
ws = ["websockets>=12"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.7", "mike>=2.1"]
all = [
    "torch",
    "colorama>=0.4",
    "aiohttp>=3.9",
    "pandas>=2.0",
    "duckdb>=1.0",
    "websockets>=12",
]
# `all` plus what the tests import (pytest: several test modules use it), so
# that `pip install -e ".[full]"` and `python -m unittest discover tests` work
full = [
    "pytest>=7.0",
    "torch",
    "colorama>=0.4",
    "aiohttp>=3.9",
    "pandas>=2.0",
    "duckdb>=1.0",
    "websockets>=12",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
release = [
    "build",
    "twine",
]

[project.urls]
Homepage = "http://klongpy.org"
Repository = "https://github.com/briangu/klongpy"
Documentation = "http://klongpy.org"

[project.scripts]
kgpy = "klongpy.cli:main"

# The compiled extension, importable as klongpy._native (klongpy/native_ext.py). abi3 (cp311+): one wheel per platform.
[[tool.setuptools-rust.ext-modules]]
target = "klongpy._native"
path = "native/klong-py/Cargo.toml"
binding = "PyO3"
py-limited-api = true
strip = "All"

# The pure Rust command, installed on PATH next to `kgpy`; needs no Python at run time.
[[tool.setuptools-rust.bins]]
target = "kg"
path = "native/klong-cli/Cargo.toml"
strip = "All"

# The wheel tag: cp311-abi3-<platform>, matching pyo3's `abi3-py311` feature in native/klong-py/Cargo.toml.
[tool.distutils.bdist_wheel]
py-limited-api = "cp311"

[tool.setuptools.packages.find]
where = ["."]
include = ["klongpy*"]

[tool.setuptools.package-data]
"klongpy" = ["lib/*.kg", "static/*.h", "data/*.json"]

[tool.pytest.ini_options]
markers = [
    "v2_reference: acceptance test requiring the q reference executable",
    "v2_gpu: acceptance test requiring a specific physical GPU",
    "v2_hosted_gpu: GPU acceptance cases supported by the Python-hosted backend",
    "v2_build: source installation, portable feature builds and attached FPGA simulation",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    # Suppress PyTorch internal deprecation warnings that we can't control
    "ignore:`torch\\.jit\\.script_method` is deprecated:DeprecationWarning:torch.jit._script",
    # Suppress gradcheck float32 warning on MPS devices (float64 not supported)
    "ignore:Input #0 requires gradient and is not a double precision floating point:UserWarning",
]
