site_name: KlongPy
site_url: https://www.klongpy.org/
repo_url: https://github.com/briangu/klongpy
repo_name: briangu/klongpy

# Define the source directory for Markdown files
docs_dir: 'docs'

# Define the directory for the built HTML files
site_dir: 'site'

# Navigation structure
nav:
  - Home: 'index.md'
  - Learn:
      - Start Here: 'getting-started.md'
      - What Runs Where: 'what-runs-where.md'
      - The kgpy command and the REPL: 'repl.md'
      - Tutorial: 'tutorial.md'
      - Examples: 'examples.md'
  - What's New:
      - What's New in v2: 'whats-new-v2.md'
      - Migrating to v2: 'migrating-to-v2.md'
      - Release Notes: 'release-notes.md'
  - Guides:
      - Klong for NumPy users: 'from-numpy.md'
      - Klong for q users: 'from-kdb.md'
      - Python Integration: 'python_integration.md'
      - PyTorch Backend and Autograd: 'torch_backend.md'
      - Performance: 'performance.md'
  - Language:
      - Operator Reference: 'operators.md'
      - Language Additions: 'language-additions.md'
      - Strict mode: 'strict.md'
      - 'Lint: kgpy lint': 'lint.md'
      - Errors: 'errors.md'
      - Differences from Klong: 'differences.md'
  - Reference:
      - System Functions and Variables: 'system-functions.md'
      - Conformance suite: 'conformance.md'
  - Data & Systems:
      - Inter-Process Communication (IPC) Capabilities: 'ipc_capabilities.md'
      - Timer: 'timer.md'
      - Web Server: 'web_server.md'
      - WebSockets: 'websockets.md'
      - Columnar tables and SQL: 'fast_columnar_database.md'
      - Table and Key-Value Stores: 'table_and_key_value_stores.md'
  - Native Runtime:
      - Native Runtime: 'native/index.md'
      - Building and Running: 'native/building.md'
      - Serial Console and Upload: 'native/console.md'
      - Porting to a Board: 'native/porting.md'
      - ESP32-P4: 'native/esp32-p4.md'
      - Two Raspberry Pi Picos calling each other: 'native/pico-bench.md'
      - IPC and Timers: 'native/ipc.md'
      - Management Node: 'native/management-node.md'
  - 'Static Klong: C and FPGA':
      - Compiling Klong to C: 'embedded.md'
      - The static profile: 'static-profile.md'
      - Klong functions as FPGA hardware: 'hardware.md'
  - Project:
      - Design Principles: 'design-principles.md'
      - Roadmap: 'roadmap.md'
      - Compiler Notes: 'compiler-roadmap.md'
      - Contributing: 'contributing.md'

# Theme configuration
theme:
  name: 'material'
  logo: 'assets/images/klongpy_logo.jpg'
  palette:
    primary: 'indigo'
    accent: 'indigo'

# Plugins configuration (if any plugins are used)
plugins:
  - search

# Extensions configuration (if any Markdown extensions are used)
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Google Analytics or other tracking (if you want to add tracking)
# google_analytics:
#   - 'UA-XXXXX-X'
#   - 'auto'

# Versioned docs: each release line is published under its own directory on the
# gh-pages branch by mike (see .github/workflows/gh-pages.yml); this adds the
# version selector to the header.
extra:
  version:
    provider: mike
    default: latest
    alias: true
