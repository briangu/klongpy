apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv
  namespace: klongpy
spec:
  capacity:
    storage: 20Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  nfs:
    # Set these to your NFS server and export before applying the manifest.
    server: nfs.example.com
    path: /exports/klongpy
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-pvc
  namespace: klongpy
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Ti
