# Native Klong runtime. Design: docs/native/index.md.
[workspace]
resolver = "2"
members = ["klong-core", "klong-dgram", "klong-ipc", "klong-rt", "klong-host", "klong-cli", "klong-lint", "klong-static", "klong-console", "klong-sim", "klong-board", "klong-ffi"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
opt-level = 3
debug = false

# Size-optimised build for small targets: cargo build --profile min-size
[profile.min-size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
