[package]
name = "klong-host"
description = "Platform for desktop operating systems (std)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
int32 = ["klong-rt/int32"]
float32 = ["klong-rt/float32"]
bigint = ["klong-rt/bigint", "klong-core/bigint"]
diag = ["klong-rt/diag", "klong-core/diag"]

[dependencies]
klong-core = { path = "../klong-core", features = ["wide-args"] }
klong-rt = { path = "../klong-rt", features = ["timers", "ipc", "compress"] }
