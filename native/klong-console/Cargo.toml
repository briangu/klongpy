[package]
name = "klong-console"
description = "The serial console of a Klong board: line editor, multi-line entry, the ^A command mode (put, hex, run, ver). no_std + alloc; a byte-at-a-time state machine over klong-rt's Platform."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["files", "lib"]
files = ["klong-rt/files"]
lib = ["klong-rt/lib"]
ipc = ["klong-rt/ipc"]
int32 = ["klong-rt/int32"]
float32 = ["klong-rt/float32"]

[dependencies]
klong-core = { path = "../klong-core" }
klong-rt = { path = "../klong-rt", default-features = false }
