[package]
name = "klong-core"
description = "Klong lexer, parser, values and evaluator. no_std + alloc."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["strings", "dicts"]
# Narrow builds: 32-bit integers and/or floats.
int32 = []
float32 = []
# Stubs (strings and dictionaries are always compiled in the spike).
strings = []
# Place the evaluator's hot functions in sections the Pico SDK's linker script puts in RAM (`.time_critical.*`): code
# in flash runs through a 16 KB cache and a flash that is read at a quarter of the clock. Only for that target.
ram-hot = []
# A diagnostic: the runtime says, before each allocation, what kind of object it is for (`htag`), in a static the board's
# allocator reads (`KLONG_ALLOC_TAG`). Off, the calls compile to nothing.
heap-tags = []
dicts = []
# Integers beyond the build width, exact (KlongPy has them): a value kind used only beyond it.
bigint = ["dep:num-bigint", "dep:num-traits"]
# Diagnostics for a desktop host: the parser's warnings and the hints of its errors, the whole-operand text of an operator's error
# (`cannot apply + (Plus) to list of 3 and list of 2`) and the description of a function value. Off for boards (flash).
diag = []
# Host values: objects of the embedder (arrays of NumPy or torch) that take part in primitives and adverbs through hooks (`Ext::host_*`),
# and operators the embedder implements (`Interp::host_op`). Off for boards: no hook is compiled.
host = ["wide-args"]
# Natives that take any number of arguments are given every one written, not the first three (a std build: .extern and .param refuse a fourth)
wide-args = []

[dependencies]
num-bigint = { version = "0.5", default-features = false, optional = true }
num-traits = { version = "0.2", default-features = false, optional = true }
# The only dependency. pow, floor, trunc and fmod for f64/f32 are not in `core`;
# libm is the pure-Rust, no_std port of musl's libm (the same code compiler-builtins uses).
libm = { version = "0.2", default-features = false }
