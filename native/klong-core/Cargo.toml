[package]
name = "klong-core"
description = "Klong lexer, parser, values and evaluator. no_std + alloc."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["strings", "dicts"]
# Narrow builds: 32-bit integers and/or floats.
int32 = []
float32 = []
# Stubs (strings and dictionaries are always compiled in the spike).
strings = []
# Place the evaluator's hot functions in sections the Pico SDK's linker script puts in RAM (`.time_critical.*`): code
# in flash runs through a 16 KB cache and a flash that is read at a quarter of the clock. Only for that target.
ram-hot = []
# A diagnostic: the runtime says, before each allocation, what kind of object it is for (`htag`), in a static the board's
# allocator reads (`KLONG_ALLOC_TAG`). Off, the calls compile to nothing.
heap-tags = []
dicts = []

[dependencies]
# The only dependency. pow, floor, trunc and fmod for f64/f32 are not in `core`;
# libm is the pure-Rust, no_std port of musl's libm (the same code compiler-builtins uses).
libm = { version = "0.2", default-features = false }
