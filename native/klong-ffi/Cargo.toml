[package]
name = "klong-ffi"
description = "The Klong board runtime (console, upload, RAM file system, library, timers) as a static library with a small C ABI, for linking into a vendor SDK application (ESP-IDF, Pico SDK). Header: include/klong.h."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# staticlib is the product. rlib is there only so that cargo builds the library before the
# integration test (which links the .a from C, not the rlib).
crate-type = ["staticlib", "rlib"]
# no unit tests: on a bare-metal target the crate has its own panic handler. The C ABI is
# tested from C (tests/c_abi.rs compiles tests/host.c against the host build of the library).
test = false
doctest = false

[features]
default = ["files", "lib", "timers"]
files = ["klong-board/files"]
lib = ["klong-board/lib"]
timers = ["klong-rt/timers"]
int32 = ["klong-board/int32"]
float32 = ["klong-board/float32"]
bigint = ["klong-board/bigint"]
diag = ["klong-board/diag"]
# kdb+ IPC needs transports from the platform; the C ABI has none yet, so it is off.
ipc = ["klong-rt/ipc"]
# The lane of a packet switch (the Pico bench): datagrams over a UART of 16-byte frames, IPC and a
# console channel on top (klong_lane_* in klong.h).
# The RP2040 (Pico SDK) build: the evaluator's hot functions in RAM.
pico = ["klong-core/ram-hot"]
lane = ["ipc", "klong-console/ipc"]
# A diagnostic of the heap (the Pico bench build): `.heap(mode)` returns the board's allocator state as integers (the board supplies
# `klong_diag`), and the runtime tells the allocator what each allocation is for (klong-core `heap-tags`).
heapdiag = ["klong-core/heap-tags"]
# C functions as system functions (klong_cfun_register, klong_eval, klong_load_static in klong.h): the Pico bench registers the
# compiled static-profile examples with it. Needs the default 64-bit integers and floats.
cfun = []

[dependencies]
klong-core = { path = "../klong-core" }
klong-rt = { path = "../klong-rt", default-features = false }
klong-console = { path = "../klong-console", default-features = false }
klong-board = { path = "../klong-board", default-features = false }

[dev-dependencies]
# the tests of the lane part of the C interface (tests/lane.c) need the feature on
klong-ffi = { path = ".", features = ["lane", "heapdiag"] }
