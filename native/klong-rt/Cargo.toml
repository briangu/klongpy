[package]
name = "klong-rt"
description = "Klong runtime around the core: Platform trait, system functions, heap accounting. no_std + alloc."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["files", "lib", "params"]
# .param and .float of the static profile, and Declarations::params and set_param for the host that runs such a program.
params = []
# Channels, .l and the file functions; they need Platform::fs.
files = []
# The pure-Klong library of klongpy/lib as text in the image.
lib = []
int32 = ["klong-core/int32"]
float32 = ["klong-core/float32"]
# .timer and .timerc.
timers = []
bigint = ["klong-core/bigint", "klong-ipc?/bigint"]
diag = ["klong-core/diag"]
# IPC over the kdb+ protocol: .cli .clid .clic .clit .srv .async.
ipc = ["dep:klong-ipc", "dep:klong-dgram"]
# Compress large IPC messages when sending (decompression is always there).
compress = ["ipc", "klong-ipc/compress"]

[dependencies]
klong-core = { path = "../klong-core" }
klong-ipc = { path = "../klong-ipc", optional = true }
klong-dgram = { path = "../klong-dgram", optional = true }

[[test]]
name = "events"
required-features = ["ipc", "timers"]
