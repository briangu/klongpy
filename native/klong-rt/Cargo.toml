[package]
name = "klong-rt"
description = "Klong runtime around the core: Platform trait, system functions, heap accounting. no_std + alloc."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["files", "lib"]
# Channels, .l and the file functions; they need Platform::fs.
files = []
# The pure-Klong library of klongpy/lib as text in the image.
lib = []
int32 = ["klong-core/int32"]
float32 = ["klong-core/float32"]

[dependencies]
klong-core = { path = "../klong-core" }
