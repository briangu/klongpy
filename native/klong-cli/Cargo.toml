[package]
name = "klong-cli"
description = "The kg binary: file, -e, REPL, --dump-ast and the conformance protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kg"
path = "src/main.rs"

[features]
default = ["bigint", "diag", "speed"]
bigint = ["klong-rt/bigint", "klong-host/bigint", "klong-core/bigint"]
diag = ["klong-rt/diag", "klong-host/diag", "klong-core/diag"]
int32 = ["klong-rt/int32", "klong-host/int32", "klong-core/int32"]
float32 = ["klong-rt/float32", "klong-host/float32", "klong-core/float32"]
# Array kernels and shorter paths a desktop has room for (klong-core/src/fast.rs); the same answers without it.
speed = ["klong-core/speed"]

[dependencies]
klong-core = { path = "../klong-core", features = ["kgpy-only"] }
klong-rt = { path = "../klong-rt" }
klong-host = { path = "../klong-host" }
klong-lint = { path = "../klong-lint" }
klong-static = { path = "../klong-static" }
klong-tools = { path = "../klong-tools" }
