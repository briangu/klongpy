[package]
name = "klong-static"
description = "The static profile: the checker (klong check), ported from klongpy/static. std; not for boards."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# host: a fixed-point value is an object of the embedder (fixed_ext.rs) that takes part in the operators
klong-core = { path = "../klong-core", features = ["bigint", "diag", "host"] }
klong-lint = { path = "../klong-lint" }
klong-rt = { path = "../klong-rt", features = ["bigint", "diag"] }
klong-host = { path = "../klong-host", features = ["bigint", "diag"] }
