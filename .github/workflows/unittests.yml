name: Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:

  linter:
    name: Linter
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pylint flake8
        pip install -e .
#     - name: Lint with pylint
#       run: python -m pylint --disable=all -e W0311 --jobs=0 --indent-string='  ' **/*.py
    - name: Lint with flake8
      run: flake8 klongpy/ --indent-size=2 --select=F,E112,E113,E304,E502,E702,E703,E71,E72,W191,W6,W605 --ignore=E731,W605,F405,F403 --statistics -j4
#     - name: Lint klongpy with pylint
#       run: pylint klongpy/

  testcpu:
    name: CPU Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # Coverage (and the torch-dependent tests/test_compiler.py) run on one leg only.
      COVERAGE_PYTHON: "3.12"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Update packages
      run: sudo apt-get update
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install CPU torch (coverage leg only)
      if: matrix.python-version == env.COVERAGE_PYTHON
      run: pip install torch --index-url https://download.pytorch.org/whl/cpu
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[web,db,ws,repl,dev]"
        pip install coverage diff-cover
    - name: Run tests (no torch)
      if: matrix.python-version != env.COVERAGE_PYTHON
      # tests/test_compiler.py needs torch; it runs in the coverage and torch jobs.
      run: python -m pytest tests/ -v --ignore=tests/test_compiler.py
    - name: Run tests with coverage
      if: matrix.python-version == env.COVERAGE_PYTHON
      run: |
        coverage run -m pytest tests/ -v
        coverage report --include='klongpy/*'
        coverage xml --include='klongpy/*'
    - name: Check coverage on new code
      if: github.event_name == 'pull_request' && matrix.python-version == env.COVERAGE_PYTHON
      run: |
        diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80

  testtorch:
    name: Torch Backend Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[web,db,ws,repl,dev]"
    - name: Run torch backend tests
      run: |
        python -m pytest tests/ -v --backend torch --device cpu

  testbackend:
    name: Test Backend Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[web,db,ws,repl,dev]"
    - name: Run test backend tests
      # tests/test_compiler.py needs torch; it runs in the torch job.
      run: |
        python -m pytest tests/ -v --backend test_backend --ignore=tests/test_compiler.py
