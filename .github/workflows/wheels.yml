name: Publish qualified RC1 distributions

# This release record promotes the exact files built by v2.0.0rc1-build.5.
# Qualification was performed against the downloaded wheels and the source archive.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload these verified RC1 distributions to PyPI
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify build identity and file checksums
    if: github.repository == 'briangu/klongpy' && github.ref == 'refs/tags/v2.0.0rc1-build.5-publish.1'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify the original build and its platform jobs
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api repos/briangu/klongpy/actions/runs/44990460823 > "$RUNNER_TEMP/run.json"
        gh api repos/briangu/klongpy/actions/runs/44990460823/jobs > "$RUNNER_TEMP/jobs.json"
        python .github/rc1/check_origin.py .github/rc1/qualification.json "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/jobs.json"
    - name: Download the original build artifacts
      uses: actions/download-artifact@v4
      with:
        run-id: 44990460823
        github-token: ${{ github.token }}
        path: original
    - name: Verify the distributions and reference-host measurements
      run: python .github/rc1/verify.py .github/rc1/qualification.json original dist
    - uses: actions/upload-artifact@v4
      with:
        name: qualified-rc1-distributions
        path: dist/
        if-no-files-found: error
  publish:
    name: Publish to PyPI
    needs: verify
    if: inputs.publish
    environment: pypi
    permissions:
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: qualified-rc1-distributions
        path: dist
    - uses: pypa/gh-action-pypi-publish@release/v1
